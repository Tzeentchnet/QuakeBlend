name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

      - name: Build fallback extension archive
        shell: pwsh
        run: ./scripts/build_extension.ps1 -BlenderExe ""

      - name: Validate extension archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem ./dist/quakeblend-*.zip | Select-Object -First 1
          if ($null -eq $zip) { throw "Extension archive was not created" }
          $expanded = Join-Path $env:RUNNER_TEMP "quakeblend-extension"
          Expand-Archive -Path $zip.FullName -DestinationPath $expanded
          $required = @(
            "blender_manifest.toml",
            "__init__.py",
            "blender/importer_map.py",
            "blender/transaction.py",
            "data/palette_q1.lmp",
            "data/palette_q2.lmp",
            "LICENSE"
          )
          foreach ($entry in $required) {
            if (-not (Test-Path (Join-Path $expanded $entry))) {
              throw "Extension archive is missing $entry"
            }
          }
          $forbidden = Get-ChildItem $expanded -Recurse -Force | Where-Object {
            $_.Name -eq "__pycache__" -or $_.Extension -eq ".pyc"
          }
          if ($forbidden) { throw "Extension archive contains Python cache files" }

      - uses: actions/upload-artifact@v4
        with:
          name: quakeblend-extension
          path: dist/quakeblend-*.zip

  blender-smoke:
    needs: test-and-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender 5.0.0
        uses: bradyajohnston/setup-blender@9d0ba03aa0f7be59e09bdc70e08418a4298185f7 # v5.1.0
        with:
          version: "5.0.0"

      - uses: actions/download-artifact@v4
        with:
          name: quakeblend-extension
          path: dist

      - name: Install built extension
        shell: pwsh
        run: |
          $zip = Get-ChildItem ./dist/quakeblend-*.zip | Select-Object -First 1
          if ($null -eq $zip) { throw "Extension artifact was not downloaded" }
          & blender --command extension install-file -r user_default -e $zip.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Blender extension install failed with exit code $LASTEXITCODE"
          }

      - name: Run Blender smoke tests
        shell: pwsh
        run: |
          $output = & blender --background --python scripts/blender_smoke.py -- `
            --extension-root bl_ext.user_default.quakeblend 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Blender smoke tests failed with exit code $exitCode"
          }
          if (($output -join "`n") -notmatch "QUAKEBLEND_SMOKE_OK") {
            throw "Blender smoke tests did not emit the success marker"
          }
